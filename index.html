<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram Video Downloader – Save Reels &amp; Videos in HD</title>
    <meta name="description" content="Download Instagram videos and Reels as MP4 in HD. Paste a public link and save it to your phone or computer in seconds." />
    <meta property="og:title" content="Instagram Video Downloader – Save Reels &amp; Videos in HD" />
    <meta property="og:description" content="Download Instagram videos and Reels as MP4 in HD. Paste a public link and save it to your phone or computer in seconds." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IGSaveGo" />

    <!-- ===== Crawl directives (static, NOT JavaScript-dependent) =====
         These must exist in the served HTML: this is a SPA, so Googlebot's
         first fetch only sees this file. Without them here, indexing depends
         entirely on JavaScript rendering (slower + far less reliable).
         NOTE: <link rel="canonical"> and og:url are intentionally NOT static
         because one shell is served for every route. They are injected per
         route into the first HTML response by functions/_middleware.ts on
         Cloudflare Pages (and by server.ts when self-hosting), so a subpage
         can never inherit the homepage canonical. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- ===== Yandex Webmaster ownership verification (static meta tag) =====
         Read by Yandex directly from the served HTML — no JavaScript and no
         server file needed. Keep this tag permanently: removing it revokes
         the verified ownership in Yandex Webmaster. -->
    <meta name="yandex-verification" content="4778040ed943270f" />

    <!-- ===== Google Analytics 4 (static, fires before JS render) =====
         The measurement ID is public by design (it ships in every pageview's
         source). Both tags carry data-tracking="google-analytics" so the
         runtime injector REPLACES them instead of appending a second gtag —
         that prevents double-counting, and lets a different ID (or an empty
         one) set in Admin override this one cleanly. -->
    <script async data-tracking="google-analytics" src="https://www.googletagmanager.com/gtag/js?id=G-LWXLE5CQD4"></script>
    <script data-tracking="google-analytics">
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LWXLE5CQD4');
    </script>
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Instagram Video Downloader – Save Reels &amp; Videos in HD" />
    <meta name="twitter:description" content="Download Instagram videos and Reels as MP4 in HD. Paste a public link and save it to your phone or computer in seconds." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e1306c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='20' height='20' x='2' y='2' rx='5' ry='5'/><path d='M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z'/><line x1='17.5' x2='17.51' y1='6.5' y2='6.5'/></svg>" />
    <!-- Structured Data JSON-LD WebApplication.
         data-schema-type lets the runtime SEO engine replace this tag instead
         of appending a second WebApplication schema on tool pages. -->
    <script type="application/ld+json" id="web-application-schema" data-schema-type="WebApplication">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "IGSaveGo",
      "url": "https://igsavego.com",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "All",
      "description": "Download Instagram Videos, Reels, Stories, Highlights, and Photos anonymously in HD.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 antialiased selection:bg-rose-500 selection:text-white">
