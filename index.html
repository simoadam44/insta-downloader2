    <meta property="og:title" content="Instagram Video Downloader (1080p Full HD) – Fast &amp; Free MP4 [No Login]" />
    <meta property="og:description" content="Download Instagram videos &amp; Reels in 1080p Full HD — [Free] [No Login] [No Watermark] [Fast MP4]. Paste a link and save it to your phone or PC in one tap." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IGSaveGo" />

    <!-- ===== Crawl directives (static, NOT JavaScript-dependent) =====
         These must exist in the served HTML: this is a SPA, so Googlebot's
         first fetch only sees this file. Without them here, indexing depends
         entirely on JavaScript rendering (slower + far less reliable).
         NOTE: <link rel="canonical"> and og:url are intentionally NOT static
         because one shell is served for every route. They are injected per
         route into the first HTML response by functions/_middleware.ts on
         Cloudflare Pages (and by server.ts when self-hosting), so a subpage
         can never inherit the homepage canonical. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- ===== Yandex Webmaster ownership verification (static meta tag) =====
         Read by Yandex directly from the served HTML — no JavaScript and no
         server file needed. Keep this tag permanently: removing it revokes
         the verified ownership in Yandex Webmaster. -->
    <meta name="yandex-verification" content="4778040ed943270f" />

    <!-- ===== Google Analytics 4 (static, fires before JS render) =====
         The measurement ID is public by design (it ships in every pageview's
         source). Both tags carry data-tracking="google-analytics" so the
         runtime injector REPLACES them instead of appending a second gtag —
         that prevents double-counting, and lets a different ID (or an empty
         one) set in Admin override this one cleanly. -->
    <script async data-tracking="google-analytics" src="https://www.googletagmanager.com/gtag/js?id=G-LWXLE5CQD4"></script>
    <script data-tracking="google-analytics">
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LWXLE5CQD4');
    </script>
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Instagram Video Downloader (1080p Full HD) – Fast &amp; Free MP4 [No Login]" />
    <meta name="twitter:description" content="Download Instagram videos &amp; Reels in 1080p Full HD — [Free] [No Login] [No Watermark] [Fast MP4]. Paste a link and save it to your phone or PC in one tap." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e1306c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='20' height='20' x='2' y='2' rx='5' ry='5'/><path d='M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z'/><line x1='17.5' x2='17.51' y1='6.5' y2='6.5'/></svg>" />
    <!-- Structured Data JSON-LD WebApplication.
         data-schema-type lets the runtime SEO engine replace this tag instead
         of appending a second WebApplication schema on tool pages. -->
    <script type="application/ld+json" id="web-application-schema" data-schema-type="WebApplication">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "IGSaveGo",
      "url": "https://www.igsavego.com",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "All",
      "description": "Download publicly available Instagram videos, Reels and photos through a browser. Story and highlight links are not supported.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- FAQPage + SoftwareApplication for the homepage, in the RAW HTML.
         Google can render FAQ rich results only when the questions are also
         visible on the page, which the prerendered body (middleware) and the
         React FAQ section both provide. Each tag carries data-schema-type so
         the per-route injector replaces it instead of stacking duplicates. -->
    <script type="application/ld+json" data-schema-type="SoftwareApplication">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "@id": "https://www.igsavego.com/#app",
      "name": "IGSaveGo Instagram Video Downloader",
      "url": "https://www.igsavego.com/",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Android, iOS, Windows, macOS, Linux",
      "inLanguage": "en",
      "description": "Download Instagram videos & Reels in 1080p Full HD — free, no login, no watermark. Paste a link and save it to your phone or PC in one tap.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock"
      }
    }
    </script>
    <script type="application/ld+json" data-schema-type="FAQPage">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "@id": "https://www.igsavego.com/#faq",
      "inLanguage": "en",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is IGSaveGo Video Downloader free to use?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. There is no payment, subscription or account. Per-IP rate limits apply to prevent abuse and keep the service available." }
        },
        {
          "@type": "Question",
          "name": "Do I need to sign in with my Instagram account?",
          "acceptedAnswer": { "@type": "Answer", "text": "No. IGSaveGo never asks for Instagram credentials and does not log in to Instagram." }
        },
        {
          "@type": "Question",
          "name": "What file format will my downloaded Instagram video be?",
          "acceptedAnswer": { "@type": "Answer", "text": "MP4 for videos and JPG for photos. The available resolution depends on what Instagram exposes for that post." }
        },
        {
          "@type": "Question",
          "name": "Can I download private Instagram videos?",
          "acceptedAnswer": { "@type": "Answer", "text": "To respect user privacy, IGSaveGo only processes videos that are publicly visible without logging in." }
        },
        {
          "@type": "Question",
          "name": "Where are Instagram videos saved on my iPhone or Android?",
          "acceptedAnswer": { "@type": "Answer", "text": "On iOS, downloads normally go to the Files app under Downloads. On Android, files are saved in your default Downloads folder." }
        }
      ]
    }
    </script>
  </head>
